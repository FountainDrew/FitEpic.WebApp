<h2 mat-dialog-title>Create a gym</h2>
<mat-dialog-content>
  <form class="dialog-form" (ngSubmit)="onSave()">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input
        matInput
        name="name"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        [maxlength]="nameMax"
        required
        autocomplete="off"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description (optional)</mat-label>
      <textarea
        matInput
        name="description"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
        [maxlength]="descriptionMax"
        rows="3"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="!canSave()" (click)="onSave()">
    Create
  </button>
</mat-dialog-actions>
