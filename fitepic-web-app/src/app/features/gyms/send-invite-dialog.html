<h2 mat-dialog-title>Send an invite</h2>
<mat-dialog-content>
  <p class="dialog-note">
    Enter the athlete's email. Invites for unknown email addresses are accepted silently — we
    won't tell you whether the address belongs to a registered account.
  </p>
  <form class="dialog-form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        name="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        autocomplete="off"
        required
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Role</mat-label>
      <mat-select
        name="role"
        [ngModel]="offeredRole()"
        (ngModelChange)="offeredRole.set($event)"
        required
      >
        @for (r of roleOptions(); track r) {
          <mat-option [value]="r">{{ r }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!canSubmit()"
    (click)="onSubmit()"
  >
    Send invite
  </button>
</mat-dialog-actions>
